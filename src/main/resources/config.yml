# ThorMace configuration

item:
  name: "&b&lThor's Hammer"
  lore:
    - "&7The hammer of Thor."
    - "&eStrike your enemies with lightning!"

lightning:
  count: 5                 # number of lightning strikes
  interval-ticks: 6        # delay between strikes (20 ticks = 1 second)
  damage-per-strike: 3.0   # extra damage per strike (3.0 = 1.5 hearts). 0 = no damage
  real: false              # true = real lightning (fire + can hurt the attacker)

blast:
  radius: 5                # radius of the flying blocks effect
  max-blocks: 200          # upper limit for performance
  duration-ticks: 40       # animation length
  min-height: 3.0
  max-height: 7.0
  drift: 1.5               # horizontal drift

curse:
  blindness-seconds: 5     # blindness for the victim (0 = disabled)
  title:                   # title is only shown to players
    enabled: true
    text: "&c&lTHOR'S CURSE"
    subtitle: ""
    fade-in-ticks: 5
    stay-ticks: 80
    fade-out-ticks: 20

launch-victim-y: 0.6       # launches the victim upwards (0 = disabled)
cooldown-seconds: 3        # per-player cooldown
affect-mobs: true          # false = only works on players

messages:
  given: "&bThor's Hammer &7has been given!"
  given-other: "&7Gave Thor's Hammer to &b%player%&7."
  no-permission: "&cYou don't have permission."
  player-not-found: "&cPlayer not found."
  reloaded: "&aConfig reloaded."
  console-needs-player: "&cFrom console use: /thormace <player>"
